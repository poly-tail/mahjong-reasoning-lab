<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc">
  <title id="title">remain temp と no-temp</title>
  <desc id="desc">remain(temp) と remain(no-temp) の違いと利用先の図。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4d5a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #334e68; stroke-width: 2; rx: 16; ry: 16; }
      .temp { fill: #eef6ff; stroke: #2b6cb0; stroke-width: 2; rx: 16; ry: 16; }
      .notemp { fill: #eefbf4; stroke: #2f855a; stroke-width: 2; rx: 16; ry: 16; }
      .use { fill: #fffaf0; stroke: #c05621; stroke-width: 2; rx: 16; ry: 16; }
      .label { font: 700 24px 'Yu Gothic UI', 'Segoe UI', sans-serif; fill: #102a43; }
      .body { font: 500 18px 'Yu Gothic UI', 'Segoe UI', sans-serif; fill: #243b53; }
      .small { font: 500 16px 'Yu Gothic UI', 'Segoe UI', sans-serif; fill: #486581; }
      .arrow { stroke: #3f4d5a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .caption { font: 700 18px 'Yu Gothic UI', 'Segoe UI', sans-serif; fill: #1f2937; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1360" height="620"/>

  <rect class="panel" x="70" y="220" width="250" height="140"/>
  <text class="label" x="195" y="265" text-anchor="middle">final line_weights</text>
  <text class="body" x="195" y="302" text-anchor="middle">Phase 4 後の</text>
  <text class="body" x="195" y="328" text-anchor="middle">line ごとの重み</text>

  <rect class="temp" x="420" y="110" width="250" height="150"/>
  <text class="label" x="545" y="155" text-anchor="middle">remain(temp)</text>
  <text class="body" x="545" y="192" text-anchor="middle">include_temporary_safe=True</text>
  <text class="body" x="545" y="218" text-anchor="middle">temporary visible suppressor を含む</text>

  <rect class="notemp" x="420" y="330" width="250" height="150"/>
  <text class="label" x="545" y="375" text-anchor="middle">remain(no-temp)</text>
  <text class="body" x="545" y="412" text-anchor="middle">include_temporary_safe=False</text>
  <text class="body" x="545" y="438" text-anchor="middle">temporary visible suppressor を除く</text>

  <rect class="use" x="780" y="90" width="240" height="120"/>
  <text class="label" x="900" y="132" text-anchor="middle">現在の remain 表示</text>
  <text class="body" x="900" y="166" text-anchor="middle">panel の current/no-temp</text>

  <rect class="use" x="780" y="250" width="240" height="120"/>
  <text class="label" x="900" y="292" text-anchor="middle">line baseline 比較</text>
  <text class="body" x="900" y="326" text-anchor="middle">temporary safe を抜いた基準</text>

  <rect class="use" x="780" y="410" width="240" height="120"/>
  <text class="label" x="900" y="452" text-anchor="middle">tint / alert 判定</text>
  <text class="body" x="900" y="486" text-anchor="middle">no-temp 側を使う箇所がある</text>

  <rect class="panel" x="1110" y="220" width="180" height="140"/>
  <text class="label" x="1200" y="265" text-anchor="middle">差分の意味</text>
  <text class="body" x="1200" y="302" text-anchor="middle">temporary visible</text>
  <text class="body" x="1200" y="328" text-anchor="middle">suppressor が</text>
  <text class="body" x="1200" y="354" text-anchor="middle">消している分</text>

  <path class="arrow" d="M 320 290 L 420 185"/>
  <path class="arrow" d="M 320 290 L 420 405"/>
  <path class="arrow" d="M 670 185 L 780 150"/>
  <path class="arrow" d="M 670 405 L 780 310"/>
  <path class="arrow" d="M 670 405 L 780 470"/>
  <path class="arrow" d="M 1020 150 L 1110 260"/>
  <path class="arrow" d="M 1020 310 L 1110 290"/>
  <path class="arrow" d="M 1020 470 L 1110 320"/>

  <text class="caption" x="680" y="575" text-anchor="middle">remain(temp) と remain(no-temp) の差 = temporary visible suppressor によって一時的に消えている line 重み</text>
</svg>
